[package]
name = "polars-grouper" # Updated to match the new name
# Keep in sync with [project].version in pyproject.toml -- this is what
# `polars_grouper.__version__` reports, via env!("CARGO_PKG_VERSION").
version = "0.7.0"
edition = "2021"

[lib]
name = "polars_grouper"
crate-type = ["cdylib"]

[dependencies]
# 0.29.3 segfaults on import (stack overflow in PolarsAllocator via Python::attach).
pyo3 = { version = "=0.29.2", features = ["extension-module", "abi3-py310"] }
pyo3-polars = { version = "0.28.0", features = ["derive", "dtype-struct"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.55.2", features=["dtype-struct"], default-features = false }
smallvec = "1.13.2"
rustc-hash = "2.0.0"
