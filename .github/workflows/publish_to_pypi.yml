name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  
  group: ${{ github.workflow }}-${{ github.ref }}
  
  cancel-in-progress: true

permissions:
  contents: read

# Make sure CI fails on all warnings, including Clippy lints
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  linux_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.3

      # Set up virtual environment instead of 'make .venv'
      - name: Set up virtual environment
        run: python -m venv .venv

      - name: Activate virtual environment and install pre-commit hooks
        run: |
          source .venv/bin/activate
          pip install -r requirements.txt
          make pre-commit

      - name: Install project
        run: |
          source .venv/bin/activate
          make install

      - name: Run tests
        run: |
          source .venv/bin/activate
          make test

  # Early-warning job: the compiled plugin binds to Polars through the
  # `polars-ffi` plugin ABI, which pip/poetry cannot see, so a breaking Polars
  # release would otherwise only surface downstream at plugin *call* time.
  # This job tests against the newest Polars on PyPI and is allowed to fail.
  # When it goes red, tighten the upper bound in [project].dependencies in
  # pyproject.toml (currently `polars>=1.3.0,<2.0.0`) and cut a release.
  latest_polars_test:
    name: Test against latest Polars (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.3

      - name: Set up virtual environment
        run: python -m venv .venv

      - name: Build against the newest Polars release
        run: |
          source .venv/bin/activate
          pip install maturin pytest
          pip install --upgrade polars
          python -c "import polars; print('Testing against polars', polars.__version__)"
          maturin develop --release

      # A clean build and a successful import prove nothing -- a plugin ABI
      # mismatch only surfaces when a registered function is actually called,
      # which the test suite does.
      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests -v

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:

          target: ${{ matrix.target }}

          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

          architecture: ${{ matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:

          target: ${{ matrix.target }}

          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:

          target: ${{ matrix.target }}

          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read  # Required for downloading built artifacts
    steps:
      # Step 1: Download Artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true

      # Step 2: Publish to PyPI
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }} # Using the PyPI token from repository secrets
        with:
          command: upload
          args: --non-interactive --skip-existing *